services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: local-docker-secret
      DATABASE_URL: sqlite:///./dietplanner.db
      CORS_ORIGINS: http://localhost:5173
      AI_PROVIDER: local
      STORAGE_PROVIDER: local
      STORAGE_DIR: storage
    volumes:
      - backend_data:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:
